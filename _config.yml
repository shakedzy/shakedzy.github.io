# Site settings
title: shakedzy.xyz - Personal Portfolio
description: My landing page :-)
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://shakedy.xyz" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Exclude files from processing
exclude:
  - README.md
  - LICENSE
  - .gitignore
  - vendor/
  - node_modules/
  - package.json
  - package-lock.json

# GitHub Pages specific settings
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# SEO settings
author:
  name: Shaked
  email: shakedzy@gmail.com
  
social:
  name: Shaked
  links:
    - https://github.com/shakedzy
    
# Additional metadata
lang: en_US
timezone: UTC

# Custom settings
show_excerpts: false
date_format: "%b %d, %Y"

# GitHub Pages gem settings
github:
  repository_nwo: shakedzy/shakedy.xyz
