<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="All talks, articles, and videos by Shaked">
    <title>All Talks & Articles - Shaked</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <style>
        .blogs-talks-videos-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
            text-decoration: none;
            margin-bottom: 30px;
            font-weight: 500;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .page-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-color);
        }
        
        .page-subtitle {
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 18px;
        }
        
        .blogs-talks-videos-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .talk-item {
            display: flex;
            gap: 20px;
            padding: 24px;
            border: 1px solid #eee;
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        
        .talk-item:hover {
            border-color: var(--border-hover);
            box-shadow: 0 2px 8px var(--shadow);
            text-decoration: none;
        }
        
        .talk-icon-large {
            font-size: 24px;
            color: var(--text-muted);
            width: 40px;
            text-align: center;
            flex-shrink: 0;
        }
        
        .talk-content-full {
            flex: 1;
        }
        
        .talk-title-large {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-color);
            line-height: 1.3;
        }
        
        .talk-meta-large {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }
        
        .talk-platform-large {
            font-weight: 500;
        }
        
        .talk-description-full {
            color: var(--text-secondary);
            line-height: 1.5;
            font-size: 14px;
        }
        
        .loading-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        
        .stats-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }
        
        @media (max-width: 600px) {
            .blogs-talks-videos-container {
                padding: 40px 16px;
            }
            
            .page-title {
                font-size: 28px;
            }
            
            .talk-item {
                flex-direction: column;
                gap: 12px;
            }
            
            .talk-icon-large {
                align-self: flex-start;
            }
            
            .talk-meta-large {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="blogs-talks-videos-container">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Back to main site
        </a>
        
        <h1 class="page-title">All Talks & Articles</h1>
        <p class="page-subtitle">A complete collection of my talks, articles, and videos.</p>
        
        <div class="stats-bar" id="stats-bar">
            Loading content...
        </div>
        
        <div class="blogs-talks-videos-list" id="blogs-talks-videos-list">
            <div class="loading-state">
                <i class="fas fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 16px;"></i>
                <p>Loading all talks and articles...</p>
            </div>
        </div>
    </div>
    
    <script>
        class AllTalksPage {
            constructor() {
                this.baseUrl = window.location.origin + window.location.pathname.replace('blogs-talks-videos.html', '');
                this.loadAllTalks();
            }
            
            async loadJSON(path) {
                try {
                    const response = await fetch(`${this.baseUrl}data/${path}`);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return await response.json();
                } catch (error) {
                    console.error(`Error loading ${path}:`, error);
                    return null;
                }
            }
            
            async loadAllTalks() {
                const talksData = await this.loadJSON('talks.json');
                if (!talksData) {
                    document.getElementById('blogs-talks-videos-list').innerHTML = `
                        <div class="loading-state">
                            <p>❌ Failed to load content</p>
                        </div>
                    `;
                    return;
                }
                
                // Merge manual and auto-fetched items
                const allTalks = [
                    ...(talksData.manual_items || []),
                    ...(talksData.auto_fetched || [])
                ];
                
                // Sort chronologically (newest first)
                allTalks.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                // Update stats
                this.updateStats(allTalks);
                
                // Render all talks
                const container = document.getElementById('blogs-talks-videos-list');
                container.innerHTML = allTalks.map(talk => `
                    <a href="${talk.link}" class="talk-item" target="_blank">
                        <div class="talk-icon-large">
                            <i class="${talk.icon}"></i>
                        </div>
                        <div class="talk-content-full">
                            <div class="talk-title-large">${talk.title}</div>
                            <div class="talk-meta-large">
                                <span class="talk-platform-large">${talk.platform}</span>
                                <span>${talk.type}</span>
                                <span>${this.formatDate(talk.date)}</span>
                                <span>${talk.views} views</span>
                            </div>
                            ${talk.description ? `<div class="talk-description-full">${talk.description}</div>` : ''}
                        </div>
                    </a>
                `).join('');
            }
            
            updateStats(talks) {
                const platforms = [...new Set(talks.map(t => t.platform))];
                const statsBar = document.getElementById('stats-bar');
                statsBar.innerHTML = `
                    <strong>${talks.length}</strong> total items from 
                    <strong>${platforms.length}</strong> platforms: 
                    ${platforms.join(', ')}
                `;
            }
            
            formatDate(dateString) {
                const date = new Date(dateString);
                return date.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
            }
        }
        
        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new AllTalksPage();
            // Initialize theme manager if not already done by main script
            if (!window.themeManager) {
                // Define a minimal theme manager for standalone pages
                const themeManager = {
                    currentTheme: (() => {
                        let theme = localStorage.getItem('theme');
                        if (!theme) {
                            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                            localStorage.setItem('theme', theme);
                        }
                        return theme;
                    })(),
                    applyTheme() {
                        const html = document.documentElement;
                        html.setAttribute('data-theme', this.currentTheme);
                    },
                    updateToggleButton() {
                        const icon = document.getElementById('theme-icon');
                        const text = document.getElementById('theme-text');
                        if (!icon || !text) return;

                        if (this.currentTheme === 'dark') {
                            icon.className = 'fas fa-moon theme-toggle-icon';
                            text.textContent = 'Dark';
                        } else {
                            icon.className = 'fas fa-sun theme-toggle-icon';
                            text.textContent = 'Light';
                        }
                    },
                    toggleTheme() {
                        this.currentTheme = this.currentTheme === 'light' ? 'dark' : 'light';
                        localStorage.setItem('theme', this.currentTheme);
                        this.applyTheme();
                        this.updateToggleButton();
                    },
                    init() {
                        this.applyTheme();
                        this.updateToggleButton();
                        const toggle = document.getElementById('theme-toggle');
                        if (toggle) {
                            toggle.addEventListener('click', () => this.toggleTheme());
                        }
                    }
                };
                themeManager.init();
                window.themeManager = themeManager;
            }
        });
    </script>
    
    <!-- Dark Mode Toggle -->
    <div class="theme-toggle" id="theme-toggle">
        <i class="fas fa-sun theme-toggle-icon" id="theme-icon"></i>
        <span class="theme-toggle-text" id="theme-text">Light</span>
    </div>
</body>
</html>
